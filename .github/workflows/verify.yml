name: Verify iOS 2048 PWA

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: bash -n release.sh release_deploy.sh scripts/activate-staged-release.sh
      - run: bash release_deploy.sh --dryrun
      - name: Verify release package
        run: |
          name="$(cat releases/.latest-release)"
          test -s "releases/$name/index.html"
          test -s "releases/$name/sw.js"
          (cd "releases/$name" && sha256sum -c --status SHA256SUMS)
